name: bluebuild-unstable
on:
  # Daily builds come from schedule-unstable.yml, which dispatches this workflow
  # with --ref unstable. A `schedule` trigger here would run on the default
  # branch (main), and BlueBuild would publish that build as :latest.
  push:
    branches:
      - unstable
    paths-ignore: # don't rebuild if only documentation has changed
      - "**.md"

  pull_request:
    branches:
      - unstable
  workflow_dispatch: # allow manually triggering builds
concurrency:
  # only run one build at a time
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build Custom Image (unstable)
    # Never build from main here: BlueBuild tags default-branch builds as :latest
    if: github.event_name == 'pull_request' || github.ref_name == 'unstable'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - recipe-nvidia-legacy.yml
          - recipe-nvidia.yml
          - recipe-main.yml

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # the build is fully handled by the reusable github action
      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          skip_checkout: true

      - name: Tag as :unstable
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          RECIPE: ${{ matrix.recipe }}
          OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_NAME=$(awk '/^name:/ {print $2}' "recipes/${RECIPE}")
          IMAGE_URI="ghcr.io/${OWNER}/${IMAGE_NAME}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          # Find the br-unstable-* tag created by bluebuild
          TAG=$(skopeo list-tags --creds="${GH_ACTOR}:${GH_TOKEN}" "docker://${IMAGE_URI}" | jq -r '.Tags[]' | grep '^br-unstable-' | sort -V | tail -n1)
          if [ -z "$TAG" ]; then
            echo "Error: No br-unstable-* tag found for ${IMAGE_URI}"
            exit 1
          fi

          echo "Copying ${IMAGE_URI}:${TAG} to ${IMAGE_URI}:unstable..."
          cosign copy -f \
            --registry-username "$GH_ACTOR" \
            --registry-password "$GH_TOKEN" \
            "${IMAGE_URI}:${TAG}" "${IMAGE_URI}:unstable"
