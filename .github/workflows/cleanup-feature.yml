name: cleanup-feature
# When a feature/* branch is deleted, delete all of its test images (see
# build-feature.yml) from GHCR. GitHub runs `delete` workflows from the
# default branch (main), so this takes effect once it's promoted there.
on:
  delete:
permissions:
  contents: read
  packages: write
jobs:
  cleanup:
    name: Delete the branch's images
    if: github.event.ref_type == 'branch' && startsWith(github.event.ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Delete the images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.ref }}
        run: |
          failed=0
          for recipe in recipe-main.yml recipe-nvidia.yml recipe-nvidia-legacy.yml; do
            IMAGE_NAME=$(awk '/^name:/ {print $2}' "recipes/${recipe}")
            .github/scripts/feature-images.sh delete "$IMAGE_NAME" "$BRANCH" || failed=1
          done
          exit "$failed"
