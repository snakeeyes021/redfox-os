# Anaconda's settings for installing RedFoxOS (matched by os-release ID=redfox).
# Adapted from Bazzite's profile.d/bazzite.conf (Apache-2.0).

[Profile]
profile_id = redfox

[Profile Detection]
os_id = redfox

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
