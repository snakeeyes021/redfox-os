# Where RedFox Hub's Advanced › Feature Branches list (and
# `redfox-rollback-helper branches`) finds feature branches' test builds.
# A machine can override this in /etc/redfox/feature-branches.conf.
#
# SOURCES: "branches" (pushed branches named PREFIX*, tagged br-<branch>-<fedora>
# by CI) and/or "prs" (open, non-draft pull requests into unstable, tagged
# pr-<number>-<fedora>), in the order to list them.
SOURCES="branches prs"
PREFIX="feature/"
