<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- RedFoxOS: let Flatpak apps see the system's fonts.

     Flatpak shows an app the host's fonts at /run/host/fonts and tells fontconfig
     to treat that folder as /usr/share/fonts, the runtime's own font folder.
     On an image-based system every folder under /usr has timestamp 0, so
     fontconfig can't tell the two apart and reuses the runtime's cached listing:
     the host's fonts never appear (seen with the Freedesktop 26.08 runtime;
     https://gitlab.com/freedesktop-sdk/freedesktop-sdk/-/issues/1563).

     This file loads the runtime's normal configuration, then gives the host
     folder its own name again, so it gets its own cache. It also keeps that
     cache apart from the one already written under the colliding name.
     Installed for every Flatpak through FONTCONFIG_FILE by redfox-flatpak-fonts. -->
<fontconfig>
  <cachedir prefix="xdg">fontconfig-redfox</cachedir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <remap-dir as-path="/run/host/fonts">/run/host/fonts</remap-dir>
</fontconfig>
