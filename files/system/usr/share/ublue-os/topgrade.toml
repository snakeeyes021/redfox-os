[include]
paths = ["/etc/ublue-os/topgrade.toml"]

[misc]
no_self_update = true
only = ["system", "flatpak", "brew_cask", "brew_formula", "firmware", "custom_commands"]
ignore_failures = ["flatpak", "brew_cask", "brew_formula", "firmware", "custom_commands"]
assume_yes = true
no_retry = false

[pre_commands]
# Wait for the automatic update (uupd) or any other rpm-ostree/bootc operation;
# rpm-ostree fails instead of waiting when another one holds the lock.
"Wait for other updates" = "/usr/libexec/redfox-wait-for-system-update"

[linux]
rpm_ostree = true

[commands]
"SoundThread" = "/usr/bin/update-soundthread --if-installed"
"Gearlever" = "/usr/bin/update-appimages"
"RedFox Apps" = "/usr/bin/update-redfox-apps"
